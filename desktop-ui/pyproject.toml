[project]
name = "offline-tools-desktop"
version = "0.1.0"
description = "Fluent offline desktop control surface for the Offline Automation & Development Suite"
requires-python = ">=3.11"
dependencies = ["PySide6==6.11.1"]

[tool.pyside6-project]
files = ["main.py", "backend.py", "qml/Main.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
