name: Installer UI CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop-ui/**'
      - 'installer-ui/**'
      - 'suite-shell/**'
      - 'skills-hub/**'
      - 'skills/**'
      - 'config/**'
      - 'scripts/**'
      - 'requirements/profiles/**'
      - 'START-HERE.cmd'
      - '.github/workflows/installer-ui-ci.yml'
  pull_request:
    paths:
      - 'desktop-ui/**'
      - 'installer-ui/**'
      - 'suite-shell/**'
      - 'skills-hub/**'
      - 'skills/**'
      - 'config/**'
      - 'scripts/**'
      - 'requirements/profiles/**'
      - 'START-HERE.cmd'
      - '.github/workflows/installer-ui-ci.yml'
  workflow_dispatch:

jobs:
  validate-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python for validation and desktop UI
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Restore applications
        run: |
          dotnet restore installer-ui/OfflineToolsSetup.csproj
          dotnet restore suite-shell/OfflineToolsSuite.csproj
          dotnet restore skills-hub/OfflineSkillsHub.csproj

      - name: Build applications
        run: |
          dotnet build installer-ui/OfflineToolsSetup.csproj -c Release --no-restore
          dotnet build suite-shell/OfflineToolsSuite.csproj -c Release --no-restore
          dotnet build skills-hub/OfflineSkillsHub.csproj -c Release --no-restore

      - name: Validate PySide6 desktop source and QML
        shell: pwsh
        run: |
          python -m py_compile desktop-ui/main.py desktop-ui/backend.py
          python -m pip install --disable-pip-version-check -r desktop-ui/requirements.txt
          Push-Location desktop-ui
          try {
            pyside6-project qmllint
          } finally {
            Pop-Location
          }

      - name: Run desktop UI backend tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest
          Push-Location desktop-ui
          try {
            python -m pytest -v
          } finally {
            Pop-Location
          }

      - name: Publish self-contained applications
        run: |
          dotnet publish installer-ui/OfflineToolsSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/setup-ui
          dotnet publish suite-shell/OfflineToolsSuite.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/suite-shell
          dotnet publish skills-hub/OfflineSkillsHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/skills-hub

      - name: Build primary PySide6 desktop UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/Build-PySide6Ui.ps1 -BundleRoot (Join-Path $PWD 'artifacts/desktop-ui')
          if ($LASTEXITCODE -ne 0) { throw 'PySide6 desktop UI build failed.' }

      - name: Validate JSON PowerShell and canonical skills
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Get-Content config/setup-profiles.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/developer-stack.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/tool-manifest.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/windows-care.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content config/skills-hub.json -Raw | ConvertFrom-Json | Out-Null

          $allErrors = @()
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $allErrors += "$($file.Name):$($err.Extent.StartLineNumber): $($err.Message)"
              }
            }
          }

          $skillDirs = @(Get-ChildItem skills/catalog -Directory)
          if ($skillDirs.Count -lt 1) { $allErrors += 'Canonical skill catalog is empty.' }
          foreach ($dir in $skillDirs) {
            $skillPath = Join-Path $dir.FullName 'SKILL.md'
            if (-not (Test-Path $skillPath)) {
              $allErrors += "Missing SKILL.md: $($dir.Name)"
              continue
            }
            $lines = @(Get-Content $skillPath)
            if ($lines.Count -lt 4 -or $lines[0].Trim() -ne '---') {
              $allErrors += "Invalid frontmatter start: $($dir.Name)"
              continue
            }
            $end = -1
            for ($i=1; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq '---') { $end = $i; break }
            }
            if ($end -lt 1) {
              $allErrors += "Missing frontmatter end: $($dir.Name)"
              continue
            }
            $front = $lines[1..($end-1)]
            $nameLine = $front | Where-Object { $_ -match '^name:\s*(.+)$' } | Select-Object -First 1
            $descriptionLine = $front | Where-Object { $_ -match '^description:\s*(.+)$' } | Select-Object -First 1
            if (-not $nameLine) { $allErrors += "Missing name: $($dir.Name)"; continue }
            if (-not $descriptionLine) { $allErrors += "Missing description: $($dir.Name)" }
            $skillName = (($nameLine -replace '^name:\s*','').Trim()).Trim('"').Trim("'")
            if ($skillName -ne $dir.Name) { $allErrors += "Skill name/folder mismatch: $($dir.Name) => $skillName" }
            if ($skillName -notmatch '^[a-z0-9]+(-[a-z0-9]+)*$') { $allErrors += "Invalid skill name format: $skillName" }
          }

          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            throw 'Repository validation failed.'
          }

      - name: Validate skill execution packs
        run: python scripts/Test-SkillExecutionPacks.py

      - name: Run executable skill scenarios
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema duckdb pypdf pymupdf
          python scripts/Run-SkillScenarioTests.py

      - name: Verify published executables
        shell: pwsh
        run: |
          $executables = @(
            'artifacts/setup-ui/OfflineToolsSetup.exe',
            'artifacts/suite-shell/OfflineToolsSuite.exe',
            'artifacts/skills-hub/OfflineSkillsHub.exe',
            'artifacts/desktop-ui/payload/bootstrap/OfflineToolsDesktop.exe'
          )
          foreach ($exe in $executables) {
            if (-not (Test-Path $exe)) { throw "Missing published executable: $exe" }
            $size = (Get-Item $exe).Length
            if ($size -lt 1MB) { throw "Published executable is unexpectedly small: $exe ($size bytes)" }
            Write-Host "$exe size: $([Math]::Round($size / 1MB, 1)) MB"
          }

      - name: Upload Windows UI test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OfflineToolsSuite-win-x64
          path: |
            artifacts/setup-ui/OfflineToolsSetup.exe
            artifacts/suite-shell/OfflineToolsSuite.exe
            artifacts/skills-hub/OfflineSkillsHub.exe
            artifacts/desktop-ui/payload/bootstrap/OfflineToolsDesktop.exe
          if-no-files-found: error
