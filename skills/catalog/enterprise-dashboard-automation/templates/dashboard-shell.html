<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Dashboard</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;height:4px;background:#dbe4f0;overflow:hidden}.top::after{content:"";display:block;height:100%;width:34%;background:#2563eb;animation:load 1.2s ease-in-out infinite}@keyframes load{50%{transform:translateX(195%)}}header,main{max-width:1440px;margin:auto;padding:20px 28px}header{display:flex;gap:16px;align-items:end;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(30,45,80,.05)}.kpi{grid-column:span 3}.wide{grid-column:span 8}.side{grid-column:span 4}.metric{font-size:28px;font-weight:750}.muted{color:#6b7280}.bars{display:flex;height:220px;align-items:end;gap:10px}.bar{flex:1;background:#2563eb;border-radius:8px 8px 3px 3px;min-height:2px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left}@media(max-width:900px){.kpi,.wide,.side{grid-column:span 12}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="top" id="progress"></div><header><div><div class="muted">Enterprise reporting</div><h1 id="title">Dashboard</h1></div><select id="period"></select></header><main><div id="kpis" class="grid"></div><div class="grid" style="margin-top:16px"><section class="card wide"><h2>Trend</h2><div id="chart" class="bars"></div></section><section class="card side"><h2>Insights</h2><div id="insights"></div></section></div><section class="card" style="margin-top:16px"><h2>Details</h2><div id="table"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;async function boot(){data=await fetch('./analysis-result.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});title.textContent=data.report?.title||data.report?.id||'Dashboard';period.innerHTML=(data.periods||[]).map(x=>`<option>${esc(x)}</option>`).join('');period.value=data.active_period||data.periods?.at(-1)||'';period.onchange=render;render();progress.style.display='none'}function render(){kpis.innerHTML=(data.kpis||[]).map(k=>`<div class="card kpi"><div class="muted">${esc(k.label)}</div><div class="metric">${esc(k.value)} ${esc(k.unit||'')}</div><div class="muted">Target ${esc(k.target??'—')}</div></div>`).join('');const c=(data.charts||[])[0]?.series?.[0]?.values||[];const max=Math.max(...c.map(Number),1);chart.innerHTML=c.map(v=>`<div class="bar" title="${esc(v)}" style="height:${Math.max(2,Number(v)/max*100)}%"></div>`).join('');insights.innerHTML=(data.insights||[]).map(x=>`<p>${esc(x.text||x)}</p>`).join('')||'<p class="muted">No insights.</p>';const t=(data.tables||[])[0];if(t){table.innerHTML=`<table><thead><tr>${(t.columns||[]).map(x=>`<th>${esc(x.label||x)}</th>`).join('')}</tr></thead><tbody>${(t.rows||[]).map(r=>`<tr>${(t.columns||[]).map(c=>`<td>${esc(r[c.key||c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}}boot().catch(e=>{progress.style.display='none';document.body.innerHTML+=`<main><div class="card"><b>Dashboard could not load.</b><pre>${esc(e)}</pre></div></main>`})
</script></body></html>
